server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # el HTML pesa ~72 KB porque lleva el logo embebido en base64.
    # gzip baja bastante la parte de texto (el base64 comprime poco, es esperable).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # el copy se edita seguido: que no quede cacheado en el celular de nadie
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /teotec-logo.png {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
